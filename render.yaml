services:
  - type: web
    name: ventas-temu-flask
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ventas-temu-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: ventas-temu-postgres
    databaseName: ventas_temu
    user: ventas_temu
